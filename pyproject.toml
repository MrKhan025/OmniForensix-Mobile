[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "omniforensix"
version = "1.1.0"
description = "Open-source cross-platform mobile digital forensics and post-acquisition artifact analysis toolkit for Android and iOS."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "MrKhan025 & OmniForensix Contributors" }
]
keywords = ["dfir", "mobile-forensics", "android-forensics", "ios-forensics", "whatsapp-decryptor", "ioc-scanner", "timeline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pillow>=10.2.0",
    "jinja2>=3.1.3",
    "pyyaml>=6.0.1",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
omniforensix = "omniforensix.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omniforensix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
